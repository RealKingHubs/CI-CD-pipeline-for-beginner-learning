name: Lab 11 Download Artifact

on: [push]

jobs:
  create-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Artifact
        run: echo "Built artifact to upload and download" > artifact.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-artifact
          path: artifact.txt

  download-artifact:
    runs-on: ubuntu-latest
    needs: create-artifact

    steps:
      - name: Checkout Code
        uses: ubuntu-latest

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: shared-artifact

      - name: Display Artifact
        run: |
          echo "Displaying artifact"
          cat artifact.txt